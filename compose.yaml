services:
  app:
    build: .
    restart: unless-stopped
    volumes:
      - app_data:/app/runtime
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Укажите домен в .env}
      ADMIN_USER: ${ADMIN_USER:?Укажите логин в .env}
      ADMIN_HASH: ${ADMIN_HASH:?Укажите хеш пароля в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  app_data:
  caddy_data:
  caddy_config:
